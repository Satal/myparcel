<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyParcel{% endblock %}</title>
    {% if settings.suite_brand %}
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="https://suite.jenkins.group/suite.css">
    <script src="https://suite.jenkins.group/switcher.js" defer></script>
    {% endif %}
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <header>
        <nav>
            {% if settings.suite_brand %}
            <jg-switcher align="left"></jg-switcher>
            <a href="/" class="logo logo-suite"><img src="/static/favicon.svg" alt="" width="28" height="28"><span>MyParcel</span></a>
            {% else %}
            <a href="/" class="logo">📦 MyParcel</a>
            {% endif %}
            <div class="nav-links">
                <a href="/">Dashboard</a>
                {% if request.session.get("user") %}
                <form action="/logout" method="post" class="inline-form">
                    <button type="submit" class="btn btn-small btn-secondary">Log out</button>
                </form>
                {% endif %}
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>MyParcel - Self-hosted parcel tracking</p>
    </footer>
</body>
</html>
