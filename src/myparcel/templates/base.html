<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyParcel{% endblock %}</title>
    <script>
        // Apply a saved theme before first paint so the page doesn't flash
        try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">📦 MyParcel</a>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌓</button>
                {% if request.session.get("user") %}
                <form action="/logout" method="post" class="inline-form">
                    <button type="submit" class="btn btn-small btn-secondary">Log out</button>
                </form>
                {% endif %}
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>MyParcel - Self-hosted parcel tracking</p>
    </footer>
    <script>
        document.getElementById("theme-toggle").addEventListener("click", function () {
            var root = document.documentElement;
            var dark = root.dataset.theme
                ? root.dataset.theme === "dark"
                : window.matchMedia("(prefers-color-scheme: dark)").matches;
            root.dataset.theme = dark ? "light" : "dark";
            try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
        });
    </script>
</body>
</html>
