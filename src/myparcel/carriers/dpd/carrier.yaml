# DPD UK Carrier Configuration
# https://www.dpd.co.uk/service/track-parcel

id: dpd
name: DPD
website: https://www.dpd.co.uk
tracking_url_template: "https://track.dpd.co.uk/parcels/{tracking_number}"
enabled: true

# Tracking number patterns
tracking_patterns:
  # Parcel code as used in track.dpd.co.uk links
  - regex: "^[0-9]{14}\\*[0-9]{5}$"
    description: "DPD parcel code (e.g. 15502055803975*21472)"

  # Parcel number (14 digits, sometimes shown with a 15th check digit)
  - regex: "^[0-9]{14,15}$"
    description: "DPD parcel number"

  # Consignment number
  - regex: "^[0-9]{10}$"
    description: "DPD consignment number (10 digits)"

# Status mapping
status_mapping:
  # DPD's first event says "received your order details", which must not read as received
  "order details": "pending"
  "expecting your parcel": "pending"

  "delivered": "delivered"
  "parcel delivered": "delivered"
  "signed for": "delivered"

  "out for delivery": "out_for_delivery"
  "with driver": "out_for_delivery"
  "on vehicle": "out_for_delivery"

  "in transit": "in_transit"
  "at dpd depot": "in_transit"
  "hub scan": "in_transit"
  "processed": "in_transit"
  "on its way": "in_transit"
  "on route": "in_transit"

  "collected": "received"
  "picked up": "received"
  "received": "received"
  "we have your parcel": "received"

  "delivery attempted": "failed_attempt"
  "carded": "failed_attempt"
  "no one available": "failed_attempt"

  "held": "held"
  "at pickup shop": "held"
  "collection point": "held"

  "returned": "returned"
  "return to sender": "returned"

# Email patterns
email_patterns:
  subject_contains:
    - "DPD"
    - "Your parcel"
    - "Delivery update"
  tracking_regex: "[0-9]{14,16}"
