# MyParcel, ready for a Portainer stack (or `docker compose up -d --build`).
#
# Required: SECRET_KEY, AUTH_USERNAME, AUTH_PASSWORD.
# MYPARCEL_DATA should be an absolute host path when deployed through Portainer;
# the relative default only makes sense for a local checkout.
services:
  myparcel:
    image: ${MYPARCEL_IMAGE:-myparcel:latest}
    build:
      context: .
      target: ${MYPARCEL_TARGET:-default}
    container_name: myparcel
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MYPARCEL_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD}
      DEFAULT_POSTCODE: ${DEFAULT_POSTCODE:-}
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-30}
      ROYAL_MAIL_CLIENT_ID: ${ROYAL_MAIL_CLIENT_ID:-}
      ROYAL_MAIL_CLIENT_SECRET: ${ROYAL_MAIL_CLIENT_SECRET:-}
    volumes:
      - ${MYPARCEL_DATA:-./data}:/app/data
    # Chromium in the "full" target needs more than Docker's 64 MB /dev/shm
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: ${MYPARCEL_MEMORY:-512m}
